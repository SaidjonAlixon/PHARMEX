; PHARMEX FOM Agent — har bir APTEKA KOMPYUTERIGA alohida o'rnatiladi
; Har PC o'z Fom_ID + CH ga ega. ODJX_ marketplace tokenini BU yerga Yozmang —
; u ro'yxatdagi 1-aptekani oladi (noto'g'ri ulanish).

[CLOUD]
; Vercel dagi sayt manzili (oxirida / bo'lmasin)
URL=https://pharmex-navy.vercel.app
; Vercel Environment Variables dagi FOM_SITE_TOKEN (ODJX_ EMAS)
TOKEN=

[PHARMACY]
; Shu kompyuterdagi F-Apteka identifikatori.
; Bo'sh = agent FAPTEKA sozlamalaridan o'zi topadi (tavsiya).
; Masalan: Fom id 16372, CH R5T5Q6H6E7T7Q
FOM_ID=
CH=
NAME=

[FOM]
; REPORT.exe manzili. "auto" = shu kompyuterda o'zi qidiradi (tavsiya).
REPORT_URL=auto
FILIAL_IDS=1
INITIAL_DAYS=90
INTERVAL_MIN=5
TIMEOUT_SEC=120

[AGENT]
LOG=agent.log
