openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dorixona moliyaviy boshqaruv platformasi API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: identity
  - name: dashboard
  - name: branches
  - name: trade
  - name: finance
  - name: debts
  - name: reports
  - name: fom
  - name: catalog
  - name: purchases
  - name: stock
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Current signed-in user and role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          $ref: "#/components/responses/BadRequest"
  /users:
    get:
      operationId: listUsers
      tags: [identity]
      summary: List application users (administrator only)
      responses:
        "200":
          description: Users and assigned roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
        "403":
          $ref: "#/components/responses/BadRequest"
  /users/role:
    patch:
      operationId: updateUserRole
      tags: [identity]
      summary: Change an application user's role (administrator only)
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Filtered financial overview and chart data
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Financial overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List pharmacy branches
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Register a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Created branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
  /branch-detail:
    get:
      operationId: getBranch
      tags: [branches]
      summary: Branch details
      parameters:
        - $ref: "#/components/parameters/BranchIdRequired"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Branch and financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /sales:
    get:
      operationId: listSales
      tags: [trade]
      summary: Search sales documents and line items
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
        - name: search
          in: query
          schema: { type: string }
        - name: paymentType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
  /inventory:
    get:
      operationId: listInventory
      tags: [trade]
      summary: Branch inventory balances
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Inventory balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
  /product-detail:
    get:
      operationId: getProduct
      tags: [trade]
      summary: Product details and branch balances
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /expenses:
    get:
      operationId: listExpenses
      tags: [finance]
      summary: Search expenses
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [finance]
      summary: Record a manual expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
  /cash-accounts:
    get:
      operationId: listCashAccounts
      tags: [finance]
      summary: Cash desks and bank accounts
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Cash and bank balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashAccount"
    post:
      operationId: createCashAccount
      tags: [finance]
      summary: Open a cash desk or bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashAccountInput"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
  /cash-register:
    get:
      operationId: getCashRegister
      tags: [finance]
      summary: Opening and closing balance of every account for a period
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Per-account period balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashRegisterRow"
  /money-operations:
    post:
      operationId: createMoneyOperation
      tags: [finance]
      summary: Record a cash or bank receipt, payment, expense or owner operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoneyOperationInput"
      responses:
        "201":
          description: Created money operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
  /money-transactions:
    get:
      operationId: listMoneyTransactions
      tags: [finance]
      summary: Cash flow operations
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
        - name: accountId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: type
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [in, out, internal] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Money operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoneyTransaction"
  /money-transfers:
    post:
      operationId: createMoneyTransfer
      tags: [finance]
      summary: Transfer money between company cash or bank accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoneyTransferInput"
      responses:
        "201":
          description: Matched debit and credit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyTransferResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /debts:
    get:
      operationId: listDebts
      tags: [debts]
      summary: Receivables and payables
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: kind
          in: query
          schema:
            type: string
            enum: [payable, receivable]
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, overdue, all]
        - name: counterpartyId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Debts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debt"
    post:
      operationId: createDebt
      tags: [debts]
      summary: Register a manual or opening debt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtInput"
      responses:
        "201":
          description: Created debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"
        "400":
          $ref: "#/components/responses/BadRequest"
  /debt-detail:
    get:
      operationId: getDebt
      tags: [debts]
      summary: Debt with its full operations history
      parameters:
        - name: debtId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Debt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /debt-operations:
    post:
      operationId: createDebtOperation
      tags: [debts]
      summary: Record a partial payment, return or write-off against a debt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtOperationInput"
      responses:
        "201":
          description: Updated debt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
  /counterparty-balances:
    get:
      operationId: listCounterpartyBalances
      tags: [debts]
      summary: Debt totals grouped by counterparty
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: kind
          in: query
          schema:
            type: string
            enum: [payable, receivable]
      responses:
        "200":
          description: Counterparty balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CounterpartyBalance"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: Product catalogue with total stock
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [catalog]
      summary: Register a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
  /counterparties:
    get:
      operationId: listCounterparties
      tags: [catalog]
      summary: Suppliers and customers
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [supplier, customer] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Counterparties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Counterparty"
    post:
      operationId: createCounterparty
      tags: [catalog]
      summary: Register a supplier or customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterpartyInput"
      responses:
        "201":
          description: Created counterparty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Counterparty"
        "400":
          $ref: "#/components/responses/BadRequest"
  /receipts:
    get:
      operationId: listReceipts
      tags: [trade]
      summary: Sales receipts and returns
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
        - name: search
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [sale, return] }
        - name: status
          in: query
          schema: { type: string, enum: [completed, voided] }
        - name: paymentMethod
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
    post:
      operationId: createReceipt
      tags: [trade]
      summary: Post a sales receipt, deducting stock and recording payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: Posted receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
  /receipt-detail:
    get:
      operationId: getReceipt
      tags: [trade]
      summary: Receipt lines, payments and linked returns
      parameters:
        - name: receiptId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Receipt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /receipts/void:
    post:
      operationId: voidReceipt
      tags: [trade]
      summary: Cancel a receipt, restoring stock and reversing payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptVoidInput"
      responses:
        "200":
          description: Voided receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
  /receipts/return:
    post:
      operationId: returnReceipt
      tags: [trade]
      summary: Accept goods back from a customer against a receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptReturnInput"
      responses:
        "201":
          description: Return document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
  /purchases:
    get:
      operationId: listPurchases
      tags: [purchases]
      summary: Supplier deliveries
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
        - name: search
          in: query
          schema: { type: string }
        - name: paymentStatus
          in: query
          schema: { type: string, enum: [paid, partial, unpaid, overdue] }
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Purchase"
    post:
      operationId: createPurchase
      tags: [purchases]
      summary: Post a supplier delivery to stock, payables and cash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Posted purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
  /purchase-detail:
    get:
      operationId: getPurchase
      tags: [purchases]
      summary: Purchase lines, payments and returns
      parameters:
        - name: purchaseId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Purchase detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /stock-documents:
    get:
      operationId: listStockDocuments
      tags: [stock]
      summary: Transfers, write-offs, returns and stock counts
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
        - name: docType
          in: query
          schema:
            $ref: "#/components/schemas/StockDocType"
      responses:
        "200":
          description: Stock documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockDocument"
    post:
      operationId: createStockDocument
      tags: [stock]
      summary: Post a transfer, write-off, supplier return or stock count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockDocumentInput"
      responses:
        "201":
          description: Posted document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocumentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
  /stock-document-detail:
    get:
      operationId: getStockDocument
      tags: [stock]
      summary: Stock document lines
      parameters:
        - name: documentId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocumentDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /reports:
    get:
      operationId: getReport
      tags: [reports]
      summary: Filtered report rows and totals
      parameters:
        - name: reportType
          in: query
          required: true
          schema:
            type: string
            enum: [sales, inventory, expenses, debts, profit, cashflow]
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /fom/status:
    get:
      operationId: getFomStatus
      tags: [fom]
      summary: FOM integration readiness and latest import
      responses:
        "200":
          description: Integration state (never returns a secret)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FomStatus"
  /fom/settings:
    get:
      operationId: getFomSettings
      tags: [fom]
      summary: REPORT.exe connection settings (access key is masked)
      responses:
        "200":
          description: Connection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FomSettings"
    put:
      operationId: saveFomSettings
      tags: [fom]
      summary: Save REPORT.exe connection settings on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FomSettingsInput"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FomSettings"
  /fom/test:
    post:
      operationId: testFomConnection
      tags: [fom]
      summary: Check FOM connectivity without exposing the server-side key
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FomActionResult"
  /fom/sync:
    post:
      operationId: syncFom
      tags: [fom]
      summary: Start an idempotent FOM import in the background
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FomSyncInput"
      responses:
        "200":
          description: Import state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FomActionResult"
components:
  parameters:
    BranchIdRequired:
      name: branchId
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    BranchId:
      name: branchId
      in: query
      schema: { type: integer, minimum: 1 }
    DateFrom:
      name: dateFrom
      in: query
      schema: { type: string, format: date }
    DateTo:
      name: dateTo
      in: query
      schema: { type: string, format: date }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AppUser:
      type: object
      properties:
        id: { type: integer }
        displayName: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, finance, viewer] }
        createdAt: { type: string, format: date-time }
      required: [id, displayName, email, role, createdAt]
    UserRoleInput:
      type: object
      properties:
        role: { type: string, enum: [admin, finance, viewer] }
      required: [role]
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Branch:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        fomId: { type: ["string", "null"] }
        kind: { type: string, enum: [pharmacy, warehouse] }
        region: { type: string }
        address: { type: string }
        manager: { type: string }
        status: { type: string }
        source: { type: string, enum: [demo, manual, fom] }
        updatedAt: { type: string, format: date-time }
      required: [id, name, kind, region, address, manager, status, source, updatedAt]
    BranchInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        fomId: { type: ["string", "null"] }
        kind: { type: string, enum: [pharmacy, warehouse] }
