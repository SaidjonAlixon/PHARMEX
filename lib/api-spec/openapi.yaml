      required: [source, protocol, host, port, reportUrl, filialIds, intervalMinutes, initialDays, timeoutSeconds, apiTokenSet, apiTokenHint, updatedAt]
    FomSettingsInput:
      type: object
      properties:
        protocol: { type: string, enum: [http, https] }
